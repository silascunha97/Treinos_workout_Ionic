services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ionic_frontend

    ports:
      - "8100:8100"

    volumes:
      # Hot reload
      - .:/app

      # Evita que node_modules do host sobrescreva
      - node_modules:/app/node_modules

    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true

    stdin_open: true
    tty: true

    restart: unless-stopped

volumes:
  node_modules: