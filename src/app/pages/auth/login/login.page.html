<ion-content class="ion-padding" color="dark">
  <div class="min-h-full max-w-sm mx-auto flex flex-col justify-center px-2 py-8">
    
    <!-- Icone Halter Lime Volt -->
    <div class="w-16 h-16 bg-volt rounded-full flex items-center justify-center mb-8 shadow-lg shadow-volt/10">
      <ion-icon name="barbell" class="text-3xl text-dark-bg -rotate-45"></ion-icon>
    </div>

    <!-- Cabeçalho -->
    <div class="mb-8">
      <h1 class="text-3xl font-extrabold text-white tracking-tight leading-tight">
        Bem-vindo de volta
      </h1>
      <p class="text-muted text-sm mt-1.5 font-medium">
        Entre para continuar seus treinos.
      </p>
    </div>

    <!-- Alerta de Erro de Autenticação / Sessão expirada -->
    @if (mensagemErro()) {
      <div class="mb-6 p-3.5 bg-red-500/10 border border-red-500/40 rounded-2xl text-red-400 text-xs font-semibold">
        {{ mensagemErro() }}
      </div>
    }

    <!-- Formulário -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">
      
      <!-- Campo E-mail -->
      <div>
        <label class="block text-[11px] font-bold text-muted tracking-widest uppercase mb-2">
          E-MAIL
        </label>
        <div 
          class="flex items-center h-14 px-5 bg-dark-input border border-dark-border rounded-full transition-colors focus-within:border-volt"
          [class.border-red-500]="loginForm.controls.email.touched && loginForm.controls.email.invalid"
        >
          <input 
            type="email" 
            formControlName="email" 
            placeholder="seu@email.com"
            autocomplete="email"
            class="w-full bg-transparent text-white outline-none text-base font-normal placeholder:text-gray-600"
          />
        </div>
      </div>

      <!-- Campo Senha -->
      <div>
        <label class="block text-[11px] font-bold text-muted tracking-widest uppercase mb-2">
          SENHA
        </label>
        <div 
          class="flex items-center h-14 px-5 bg-dark-input border border-dark-border rounded-full transition-colors focus-within:border-volt"
          [class.border-red-500]="loginForm.controls.senha.touched && loginForm.controls.senha.invalid"
        >
          <input 
            [type]="showPassword() ? 'text' : 'password'" 
            formControlName="senha" 
            placeholder="••••••••"
            class="w-full bg-transparent text-white outline-none text-base font-normal placeholder:text-gray-600"
          />
          <button 
            type="button" 
            (click)="togglePasswordVisibility()" 
            class="text-muted hover:text-white transition-colors p-1 flex items-center justify-center outline-none"
          >
            <ion-icon [name]="showPassword() ? 'eye-off-outline' : 'eye-outline'" class="text-xl"></ion-icon>
          </button>
        </div>
      </div>

      <!-- Esqueci minha senha -->
      <div class="pt-1">
        <a routerLink="/auth/forgot-password" class="text-volt font-bold text-sm hover:underline">
          Esqueci minha senha
        </a>
      </div>

      <!-- Botão Entrar -->
      <button 
        type="submit" 
        [disabled]="authService.isLoading()"
        class="w-full h-14 bg-volt text-dark-bg font-extrabold text-base rounded-full active:scale-[0.98] active:opacity-90 transition-all flex items-center justify-center mt-2 disabled:opacity-50"
      >
        @if (authService.isLoading()) {
          <ion-spinner name="crescent" color="dark"></ion-spinner>
        } @else {
          Entrar
        }
      </button>
    </form>

    <!-- Divisor "OU" -->
    <div class="relative flex items-center justify-center my-7">
      <div class="w-full border-t border-dark-border"></div>
      <span class="absolute bg-dark-bg px-3 text-[11px] font-bold text-muted tracking-widest uppercase">
        OU
      </span>
    </div>

    <!-- Botão Google -->
    <button 
      type="button"
      (click)="loginWithGoogle()"
      class="w-full h-14 bg-transparent border border-dark-border text-white font-bold text-sm rounded-full flex items-center justify-center gap-3 active:bg-dark-input transition-colors"
    >
      <ion-icon name="logo-google" class="text-lg"></ion-icon>
      <span>Continuar com Google</span>
    </button>

    <!-- Rodapé -->
    <p class="text-center text-muted text-sm font-medium mt-8">
      Não tem conta? 
      <a routerLink="/auth/register" class="text-volt font-bold hover:underline ml-1">
        Criar conta
      </a>
    </p>

  </div>
</ion-content>
