<div class="grid grid-cols-3 gap-3">
  @for (item of itens(); track item.label) {
    <div
      class="surface-card p-4 flex flex-col items-center justify-center gap-1.5 text-center"
    >
      @if (loading()) {
        <ion-skeleton-text [animated]="true" class="w-10 h-5 rounded-app-sm"></ion-skeleton-text>
      } @else {
        <span class="text-xl font-extrabold text-white leading-none">{{ item.valor }}</span>
      }
      <span class="text-[10px] font-bold tracking-wider text-muted uppercase">{{ item.label }}</span>
    </div>
  }
</div>
